name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
        react: [18, 19]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - if: matrix.react == 18
        run: npm install --no-save --package-lock=false react@18 react-dom@18 @types/react@18 @types/react-dom@18
      - run: npm test
      - run: npm run test:package
        env:
          TEST_REACT_VERSION: ${{ matrix.react }}
